<svg xmlns="http://www.w3.org/2000/svg" width="450" height="145" viewBox="0 0 450 145" role="img"><title>footer-mobile</title><style>text{fill:#e9e2ce;font-family:Georgia,serif}.mono{font-family:monospace;fill:#a9ac92;letter-spacing:3px}.red{fill:#bd4b42}.muted{fill:#a9ac92}.sweep{animation:sweep 7s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 5s ease-in-out infinite}.ember{animation:ember 6s ease-in-out infinite}.type{animation:type 8s steps(24,end) infinite}@keyframes sweep{from{transform:translateX(-900px)}to{transform:translateX(900px)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes draw{0%{stroke-dashoffset:1100}55%,100%{stroke-dashoffset:0}}@keyframes ember{0%,100%{transform:translateY(10px);opacity:.1}50%{transform:translateY(-28px);opacity:.8}}@keyframes type{0%{width:0}35%,85%{width:800px}100%{width:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.type{width:800px}}</style><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#32392b" stroke-width=".6"/></pattern><linearGradient id="fade"><stop stop-color="#b6483b" stop-opacity="0"/><stop offset=".5" stop-color="#b6483b" stop-opacity=".35"/><stop offset="1" stop-color="#b6483b" stop-opacity="0"/></linearGradient></defs><rect width="450" height="145" fill="#111710"/><rect width="450" height="145" fill="url(#grid)"/><rect x="12" y="12" width="426" height="121" fill="none" stroke="#596049"/><path d="M12 44V12H44 M406 12H438V44 M12 101V133H44 M406 133H438V101" fill="none" stroke="#c0b48b" stroke-width="2"/><text x="28" y="69" font-size="34" class="">AVANZA. SEMPRE.</text><text x="28" y="112" font-size="12" class="mono">CI VEDIAMO OLTRE LE MURA</text><path class="draw" d="M28 85H420" stroke="#b6483b"/></svg>